          PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;

          SET @c := (SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='exam_system' AND table_name='exam_record_answers' AND column_name='review_flag');
          SET @s := IF(@c=0, 'ALTER TABLE exam_record_answers ADD COLUMN review_flag ENUM(''none'',''disputed'',''high_score'') DEFAULT ''none'' COMMENT ''复核标记: disputed-争议 high_score-高分样卷'' AFTER grading_status', 'SELECT 1');
          PREPARE stmt FROM @s; EXECUTE stmt; DEALLOCATE PREPARE stmt;

