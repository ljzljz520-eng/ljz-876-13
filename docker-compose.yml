          INSERT INTO questions (category_id, type, title, options, answer, analysis, difficulty, score, created_by, status)
          SELECT 4, 'essay', '什么是死锁？简述产生死锁的四个必要条件。', NULL,
          '参考答案：死锁是指多个进程在运行过程中因争夺资源而造成的一种僵局，若无外力作用，这些进程都将无法继续推进。四个必要条件：1）互斥条件：资源一次只能被一个进程占用；2）占有且等待条件：进程已占有部分资源，又申请新资源而阻塞；3）不可剥夺条件：进程已占有的资源不能被强制收回；4）循环等待条件：存在进程资源的循环等待链。',
          '四个必要条件缺一不可，破坏任一条件即可预防死锁。', 2, 9.00, 2, 1
