          echo "Database initialized from inline schema."
          fi

          # ========== 分层批阅功能：幂等升级段（新库/老库均安全执行） ==========
          mysql -h db -uroot -proot exam_system <<'SQL'
          SET NAMES utf8mb4;

          CREATE TABLE IF NOT EXISTS classes (
              id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
              name VARCHAR(100) NOT NULL COMMENT '班级名称',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='班级表';

          CREATE TABLE IF NOT EXISTS question_rubric_points (
              id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
              question_id BIGINT UNSIGNED NOT NULL COMMENT '题目ID',
              title VARCHAR(200) NOT NULL COMMENT '评分点名称',
              max_score DECIMAL(5,2) NOT NULL COMMENT '评分点满分',
              sort_order INT DEFAULT 0 COMMENT '排序',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
              INDEX idx_question_id (question_id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='主观题评分点表';

          CREATE TABLE IF NOT EXISTS grading_records (
              id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
              exam_record_answer_id BIGINT UNSIGNED NOT NULL COMMENT '考生答案ID',
              grader_id BIGINT UNSIGNED NOT NULL COMMENT '批阅人ID',
              stage ENUM('initial', 'review') NOT NULL COMMENT '阶段: initial-初评 review-复核',
              total_score DECIMAL(5,2) NOT NULL COMMENT '本次评定分数',
              comment TEXT COMMENT '学生可见评语',
              internal_note TEXT COMMENT '内部备注(学生不可见)',
              reason VARCHAR(500) COMMENT '修改原因(复核调整必填)',
              review_flag ENUM('none', 'disputed', 'high_score') DEFAULT 'none' COMMENT '本次设置的复核标记',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              INDEX idx_answer (exam_record_answer_id),
              INDEX idx_grader (grader_id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='批阅流水表(审计追溯)';

          CREATE TABLE IF NOT EXISTS grading_record_points (
              id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
              grading_record_id BIGINT UNSIGNED NOT NULL COMMENT '批阅流水ID',
              rubric_point_id BIGINT UNSIGNED NOT NULL COMMENT '评分点ID',
              score DECIMAL(5,2) NOT NULL COMMENT '该评分点得分',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              INDEX idx_grading_record_id (grading_record_id),
              INDEX idx_rubric_point_id (rubric_point_id)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci COMMENT='批阅评分点得分表';

          SET @c := (SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='exam_system' AND table_name='users' AND column_name='class_id');
          SET @s := IF(@c=0, 'ALTER TABLE users ADD COLUMN class_id BIGINT UNSIGNED NULL COMMENT ''班级ID'' AFTER status', 'SELECT 1');
